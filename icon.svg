<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (App Icon shape) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ring / Timer Body -->
  <circle cx="256" cy="276" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="24" filter="url(#glow)" />
  
  <!-- Timer Top Button / Crown -->
  <rect x="226" y="76" width="60" height="30" rx="6" fill="url(#goldGrad)" />
  <rect x="241" y="56" width="30" height="24" rx="4" fill="url(#goldGrad)" />

  <!-- Timer Hands / Indicators -->
  <line x1="256" y1="276" x2="310" y2="230" stroke="#facc15" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="276" r="14" fill="#fbbf24" />

  <!-- Display Text (4.856) -->
  <text x="256" y="445" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="2">4.856</text>
</svg>